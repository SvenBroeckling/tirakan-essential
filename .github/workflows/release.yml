name: Build and Release PDFs

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current version
        id: version
        shell: bash
        run: |
          version="$(grep -oP '\\newcommand\{\\tirakanversion\}\{\K[^}]+' version.tex | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read version from version.tex" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$version' from version.tex is not in x.y.z format" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches version.tex
        shell: bash
        run: |
          expected_tag="v${{ steps.version.outputs.value }}"
          actual_tag="${GITHUB_REF_NAME}"
          if [[ "$actual_tag" != "$expected_tag" ]]; then
            echo "Tag '$actual_tag' does not match version.tex ('$expected_tag')." >&2
            exit 1
          fi

      - name: Extract release notes from changelog
        id: changelog
        shell: bash
        run: |
          chmod +x scripts/extract_changelog_release.sh
          scripts/extract_changelog_release.sh "${{ steps.version.outputs.value }}" release-notes.md
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Build sheet.tex pass 1
        uses: xu-cheng/latex-action@v3
        with:
          root_file: sheet.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -halt-on-error

      - name: Build sheet.tex pass 2
        uses: xu-cheng/latex-action@v3
        with:
          root_file: sheet.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -halt-on-error

      - name: Build main.tex pass 1
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -halt-on-error

      - name: Build main.tex pass 2
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          args: -interaction=nonstopmode -halt-on-error

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tirakan-essential-pdfs-v${{ steps.version.outputs.value }}
          path: |
            main.pdf
            sheet.pdf
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            main.pdf
            sheet.pdf
